<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lupa de Fórmulas</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="janela.css?v=0.3.0">
</head>
<body data-modo="formula">
  <div class="barra">
    <button id="btn-voltar" title="Voltar à exploração anterior (Alt+←)" disabled>← Voltar</button>
    <span id="titulo" class="titulo">—</span>
    <span class="dica" title="Clique: seleciona no Excel. Cmd/Ctrl+clique: vários. Duplo clique ou Ctrl+Q: explorar. Ctrl+Shift+Q: dependentes. F2: editar a parte. Enter: fechar. Esc: fechar e voltar.">
      Clique: seleciona · Duplo clique ou Ctrl+Q: explorar · Ctrl+Shift+Q: dependentes
    </span>
  </div>

  <div id="fluxo-form" class="fluxo-form" hidden>
    <fieldset>
      <legend>Âmbito da análise</legend>
      <label><input type="radio" name="ambito" value="arquivo" checked> Arquivo inteiro</label>
      <label><input type="radio" name="ambito" value="aba"> Aba <span id="op-aba"></span></label>
      <label><input type="radio" name="ambito" value="selecao"> Seleção <span id="op-sel-ambito"></span></label>
    </fieldset>
    <fieldset>
      <legend>Área de foco</legend>
      <label><input type="radio" name="foco" value="ambito" checked> Todo o âmbito</label>
      <label><input type="radio" name="foco" value="selecao"> Seleção <span id="op-sel-foco"></span></label>
    </fieldset>
    <p class="nota">Com o foco numa seleção, aparece também a visão de fluxos: o que entra e o que sai dela.
      Referências feitas por DESLOC e INDIRETO não entram na análise.</p>
    <div><button id="btn-analisar" class="primario">Analisar</button></div>
  </div>

  <div id="abas" class="abas" hidden></div>

  <div id="arvore" class="grade" role="tree" tabindex="0">
    <div class="cab"><span>Elemento</span><span>Info</span><span class="dir">Valor</span><span class="dir">Local</span></div>
    <div id="linhas"></div>
  </div>

  <div class="editor">
    <div id="realce" class="realce" aria-hidden="true"></div>
    <textarea id="formula" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Fórmula"></textarea>
  </div>

  <div id="mensagem" class="mensagem" hidden></div>

  <div class="rodape">
    <div class="mais">
      <button id="btn-mais">Mais ▾</button>
      <div id="menu-mais" class="menu" hidden>
        <button data-acao="explorar">Explorar a seleção (Ctrl+Q)</button>
        <button data-acao="dependentes">Rastrear dependentes (Ctrl+Shift+Q)</button>
        <button data-acao="expandir">Expandir tudo</button>
        <button data-acao="recolher">Recolher tudo</button>
        <button data-acao="copiar">Copiar árvore</button>
        <button data-acao="manter" class="so-cores">Fechar mantendo as cores (Alt+X)</button>
      </div>
    </div>
    <span class="espaco"></span>
    <button id="btn-aplicar" title="Grava a fórmula editada (Enter)" disabled>Aplicar</button>
    <button id="btn-ok" class="primario">OK</button>
  </div>

  <script src="janela.js?v=0.3.0"></script>
</body>
</html>
